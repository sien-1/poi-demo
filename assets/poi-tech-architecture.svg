<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1160" width="1400" height="1160">
  <defs>
    <marker id="data-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5d8884"/>
    </marker>
    <marker id="alert-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b95757"/>
    </marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c99a43"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #17313c; }
      .title { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
      .subtitle { font-size: 16px; fill: #70817f; }
      .layer { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #2d6f6b; }
      .card-title { font-size: 17px; font-weight: 700; }
      .body { font-size: 13px; fill: #5f7571; }
      .small { font-size: 11px; fill: #829490; }
      .chip { font-size: 12px; fill: #345f5b; }
      .footer { font-size: 12px; fill: #8fa29e; }
    </style>
  </defs>

  <rect width="1400" height="1160" rx="24" fill="#f4f8f7"/>
  <circle cx="1250" cy="75" r="160" fill="#e8f3ef" opacity="0.7"/>

  <text x="60" y="70" class="title">POI 数字疗法 · 功能模块与技术架构</text>
  <text x="60" y="104" class="subtitle">分层架构：数据采集 → 模型与规则 → 干预执行 → 结局追踪</text>

  <!-- 图例 -->
  <g>
    <line x1="1010" y1="60" x2="1050" y2="60" stroke="#5d8884" stroke-width="2" marker-end="url(#data-arrow)"/>
    <text x="1060" y="65" class="small">数据流</text>
    <line x1="1010" y1="84" x2="1050" y2="84" stroke="#b95757" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#alert-arrow)"/>
    <text x="1060" y="89" class="small">异常预警</text>
    <line x1="1150" y1="60" x2="1190" y2="60" stroke="#c99a43" stroke-width="2" marker-end="url(#loop-arrow)"/>
    <text x="1200" y="65" class="small">审核 / 反馈</text>
  </g>

  <!-- 1 数据采集层 -->
  <rect x="60" y="130" width="1280" height="155" rx="18" fill="#eef6f3" stroke="#cfe2db"/>
  <text x="86" y="166" class="layer">01  数据采集层</text>
  <text x="86" y="190" class="small">患者自报 + 临床检查 + 随访行为，统一转化为结构化字段</text>

  <g>
    <rect x="84" y="210" width="220" height="52" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="194" y="241" text-anchor="middle" class="chip">预测问卷</text>
    <rect x="324" y="210" width="220" height="52" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="434" y="241" text-anchor="middle" class="chip">随访问卷 / 量表</text>
    <rect x="564" y="210" width="220" height="52" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="674" y="241" text-anchor="middle" class="chip">激素 / 辅助检查</text>
    <rect x="804" y="210" width="220" height="52" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="914" y="241" text-anchor="middle" class="chip">病历 / 用药记录</text>
    <rect x="1044" y="210" width="250" height="52" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="1169" y="241" text-anchor="middle" class="chip">行为 / 依从性数据</text>
  </g>

  <line x1="700" y1="285" x2="700" y2="330" stroke="#5d8884" stroke-width="2.5" marker-end="url(#data-arrow)"/>

  <!-- 2 处理与模型层 -->
  <rect x="60" y="340" width="1280" height="225" rx="18" fill="#ffffff" stroke="#dbe5e4"/>
  <text x="86" y="378" class="layer">02  数据处理、模型与规则</text>
  <text x="86" y="402" class="small">模型输出只做风险提示；临床红线独立于概率模型，优先触发人工评估</text>

  <g>
    <rect x="84" y="425" width="280" height="112" rx="14" fill="#f7fbf9" stroke="#dbe5e4"/>
    <text x="106" y="456" class="card-title">结构化与质控</text>
    <text x="106" y="482" class="body">字段校验 · 有效值域 · 缺失值策略</text>
    <text x="106" y="506" class="small">保留数据来源与时间戳</text>

    <rect x="386" y="425" width="280" height="112" rx="14" fill="#f7fbf9" stroke="#dbe5e4"/>
    <text x="408" y="456" class="card-title">可解释风险模型</text>
    <text x="408" y="482" class="body">逻辑回归基线 → 随机森林探索</text>
    <text x="408" y="506" class="small">概率 + 可解释因素 + 建议动作</text>

    <rect x="688" y="425" width="280" height="112" rx="14" fill="#fff8ea" stroke="#e4d0a9"/>
    <text x="710" y="456" class="card-title">临床红线规则</text>
    <text x="710" y="482" class="body">FSH + 闭经时长满足诊断标准</text>
    <text x="710" y="506" class="small">不依赖概率，直接升级医生评估</text>

    <rect x="990" y="425" width="304" height="112" rx="14" fill="#f7fbf9" stroke="#dbe5e4"/>
    <text x="1012" y="456" class="card-title">风险分层与路由</text>
    <text x="1012" y="482" class="body">低 / 中 / 高 / 临床红线</text>
    <text x="1012" y="506" class="small">按行为响应动态调整干预强度</text>
  </g>

  <line x1="700" y1="565" x2="700" y2="615" stroke="#c99a43" stroke-width="2.5" marker-end="url(#loop-arrow)"/>
  <rect x="590" y="580" width="220" height="32" rx="16" fill="#fff8ea" stroke="#e4d0a9"/>
  <text x="700" y="601" text-anchor="middle" font-size="12" font-weight="700" fill="#8a6526">医生审核 · 人在回路</text>

  <!-- 3 干预执行层 -->
  <rect x="60" y="625" width="1280" height="335" rx="18" fill="#ffffff" stroke="#dbe5e4"/>
  <text x="86" y="663" class="layer">03  干预执行层</text>
  <text x="86" y="687" class="small">患者端负责执行与反馈；医生端负责审核、预警和人工升级</text>

  <!-- 患者端 -->
  <rect x="84" y="715" width="590" height="215" rx="16" fill="#f7fbf9" stroke="#dbe5e4"/>
  <text x="110" y="750" class="card-title">患者端 App</text>
  <text x="110" y="775" class="small">日常使用主入口：移动端优先</text>

  <g>
    <rect x="110" y="800" width="155" height="46" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="187" y="828" text-anchor="middle" class="chip">首页 / 今日任务</text>
    <rect x="280" y="800" width="155" height="46" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="357" y="828" text-anchor="middle" class="chip">风险评估</text>
    <rect x="450" y="800" width="190" height="46" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="545" y="828" text-anchor="middle" class="chip">复诊与随访</text>

    <rect x="110" y="860" width="155" height="46" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="187" y="888" text-anchor="middle" class="chip">健康教育</text>
    <rect x="280" y="860" width="155" height="46" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="357" y="888" text-anchor="middle" class="chip">健康监测</text>
    <rect x="450" y="860" width="190" height="46" rx="10" fill="#ffffff" stroke="#dbe5e4"/>
    <text x="545" y="888" text-anchor="middle" class="chip">用药与补剂</text>
  </g>

  <!-- 医生端 -->
  <rect x="726" y="715" width="590" height="215" rx="16" fill="#fffaf0" stroke="#e4d0a9"/>
  <text x="752" y="750" class="card-title">医生端 Web</text>
  <text x="752" y="775" class="small">管理、审核与异常处理：桌面端优先</text>

  <g>
    <rect x="752" y="800" width="250" height="46" rx="10" fill="#ffffff" stroke="#e4d0a9"/>
    <text x="877" y="828" text-anchor="middle" class="chip">临床红线预警</text>
    <rect x="1022" y="800" width="250" height="46" rx="10" fill="#ffffff" stroke="#e4d0a9"/>
    <text x="1147" y="828" text-anchor="middle" class="chip">方案审核</text>
    <rect x="752" y="860" width="250" height="46" rx="10" fill="#ffffff" stroke="#e4d0a9"/>
    <text x="877" y="888" text-anchor="middle" class="chip">人工 / 电话随访</text>
    <rect x="1022" y="860" width="250" height="46" rx="10" fill="#ffffff" stroke="#e4d0a9"/>
    <text x="1147" y="888" text-anchor="middle" class="chip">患者档案与结局</text>
  </g>

  <!-- 监测到医生端预警 -->
  <path d="M640 883 C680 883 680 820 726 820" stroke="#b95757" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#alert-arrow)"/>
  <text x="666" y="800" font-size="10" fill="#b95757">异常预警</text>

  <!-- 4 结局追踪 -->
  <rect x="60" y="990" width="1120" height="105" rx="18" fill="#eef6f3" stroke="#cfe2db"/>
  <text x="86" y="1026" class="layer">04  结局追踪与迭代</text>
  <text x="86" y="1054" class="body">依从性 · 复诊完成率 · 症状/量表变化 · 临床结局 · 不良事件</text>
  <text x="86" y="1077" class="small">用于评价干预效果、更新模型与调整任务强度；所有模型更新需医生审核</text>

  <!-- 反馈回路 -->
  <path d="M1210 1040 C1280 1040 1280 470 1220 470" stroke="#c99a43" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#loop-arrow)"/>
  <text x="1260" y="760" font-size="11" fill="#9f7a32" transform="rotate(90 1260 760)">结局反馈 → 模型迭代</text>

  <!-- 免责声明 -->
  <text x="700" y="1135" text-anchor="middle" class="footer">功能原型 · 所有患者数据为模拟 · 预测结果仅作风险提示，不替代医生诊断与治疗</text>
</svg>
