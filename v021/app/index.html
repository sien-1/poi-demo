<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POI 患者端 · V0.2.1</title>
  <link rel="stylesheet" href="../shared/base.css" />
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div class="phone-stage">
    <div class="phone">
      <div class="phone-status">
        <span>9:41</span>
        <span>演示模式 · V0.2.1</span>
        <span>▮▮ ◔ ▰</span>
      </div>

      <header class="app-header">
        <div>
          <p class="eyebrow">POI PATIENT APP</p>
          <h1 id="page-title">上传医嘱</h1>
        </div>
        <div class="avatar">王</div>
      </header>

      <main class="app-main">
        <section class="screen active" id="screen-upload">
          <div class="demo-banner">
            <strong>模拟数据</strong>
            <span>演示日期 2026-11-01，所有医嘱与任务均不构成真实医疗建议。</span>
          </div>
          <div id="upload-panel"></div>
          <div id="followup-summary"></div>
          <section class="mini-section">
            <div class="section-head">
              <h2>最近消息</h2>
              <button class="link-btn" data-screen="records">全部消息</button>
            </div>
            <div id="recent-messages"></div>
          </section>
        </section>

        <section class="screen" id="screen-calendar">
          <div class="screen-title">
            <div>
              <p class="eyebrow">INTERVENTION CALENDAR</p>
              <h2>个人干预日历</h2>
            </div>
            <span class="pill blue">演示日 · 11-01</span>
          </div>
          <div id="task-summary"></div>
          <div id="task-list" class="task-list"></div>
        </section>

        <section class="screen" id="screen-records">
          <div class="screen-title">
            <div>
              <p class="eyebrow">RECORDS & MESSAGES</p>
              <h2>病例夹与消息</h2>
            </div>
            <span class="pill mint">同一患者 P001</span>
          </div>
          <div id="record-summary"></div>
          <section class="mini-section">
            <div class="section-head">
              <h2>消息中心</h2>
            </div>
            <div id="message-list"></div>
          </section>
          <button class="reset-link" data-action="reset-demo">重置演示数据</button>
        </section>
      </main>

      <nav class="bottom-nav" aria-label="患者端主导航">
        <button class="nav-tab active" data-screen="upload"><span>＋</span>上传</button>
        <button class="nav-tab" data-screen="calendar"><span>▦</span>日历</button>
        <button class="nav-tab" data-screen="records"><span>▤</span>病例<em id="unread-badge" class="unread-badge hidden">0</em></button>
      </nav>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="../shared/demo-store.js"></script>
  <script src="app.js"></script>
</body>
</html>
