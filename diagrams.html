<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POI 数字疗法 · 设计图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 18px 60px;
      background: #f3f6f6;
      color: #17313c;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #2d6f6b;
      font-size: 13px;
      text-decoration: none;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 26px; color: #70817f; font-size: 14px; }
    .diagram-card {
      margin-bottom: 26px;
      padding: 18px;
      border: 1px solid #dbe5e4;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(16, 42, 53, 0.07);
    }
    .diagram-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    .diagram-head h2 { margin: 0; font-size: 18px; }
    .diagram-head a { color: #2d6f6b; font-size: 12px; }
    .diagram-head > div { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .zoom-btn {
      padding: 5px 10px;
      border: 1px solid #bcd8cf;
      border-radius: 999px;
      background: #edf6f3;
      color: #1f5b58;
      font-size: 12px;
      font-weight: 700;
    }
    .diagram-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #f4f8f7;
      cursor: zoom-in;
    }
    .zoom-hint {
      display: inline-block;
      margin-left: 10px;
      color: #8fa29e;
      font-size: 11px;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(8, 26, 33, 0.9);
    }
    .lightbox.hidden {
      display: none;
    }
    .lightbox img {
      max-width: 96vw;
      max-height: 88vh;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 22px;
      line-height: 1;
    }
    .note {
      margin: 18px 0 0;
      color: #8fa29e;
      font-size: 12px;
      line-height: 1.7;
    }
    @media (max-width: 640px) {
      .diagram-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .diagram-head > div {
        flex-wrap: wrap;
      }
      .zoom-hint {
        display: block;
        margin: 4px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 返回演示入口</a>
    <h1>POI 数字疗法 · 两张设计图</h1>
    <p class="subtitle">概念图与分层技术架构图 · 可直接打开 SVG 或用于汇报排版</p>

    <section class="diagram-card">
      <div class="diagram-head">
        <h2>概念图：核心痛点 → 产品定位 → 全周期 → 功能模块<span class="zoom-hint">点击图片可放大</span></h2>
        <div>
          <button class="zoom-btn" data-src="assets/poi-concept-map.svg?v=3">放大查看</button>
          <a href="assets/poi-concept-map.svg?v=3" target="_blank" rel="noopener">打开 SVG 原图 →</a>
        </div>
      </div>
      <img src="assets/poi-concept-map.svg?v=3" alt="POI 数字疗法概念图" />
    </section>

    <section class="diagram-card">
      <div class="diagram-head">
        <h2>技术架构：数据 → 模型与规则 → 干预 → 结局追踪<span class="zoom-hint">点击图片可放大</span></h2>
        <div>
          <button class="zoom-btn" data-src="assets/poi-tech-architecture.svg?v=3">放大查看</button>
          <a href="assets/poi-tech-architecture.svg?v=3" target="_blank" rel="noopener">打开 SVG 原图 →</a>
        </div>
      </div>
      <img src="assets/poi-tech-architecture.svg?v=3" alt="POI 数字疗法技术架构图" />
    </section>

    <p class="note">
      两张图均为功能原型设计，数据与流程为演示用途；预测结果仅作风险提示，不替代医生诊断与治疗。
    </p>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="图片放大预览">
    <button id="lightbox-close" class="lightbox-close" aria-label="关闭">×</button>
    <img id="lightbox-img" alt="设计图放大预览" />
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");

    document.querySelectorAll(".diagram-card img").forEach(image => {
      image.addEventListener("click", () => {
        lightboxImg.src = image.src;
        lightboxImg.alt = image.alt;
        lightbox.classList.remove("hidden");
      });
    });

    document.querySelectorAll(".zoom-btn").forEach(button => {
      button.addEventListener("click", () => {
        lightboxImg.src = button.dataset.src;
        lightboxImg.alt = "设计图放大预览";
        lightbox.classList.remove("hidden");
      });
    });

    function closeLightbox() {
      lightbox.classList.add("hidden");
      lightboxImg.removeAttribute("src");
    }

    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closeLightbox();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !lightbox.classList.contains("hidden")) {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
