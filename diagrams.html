<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>POI 数字疗法 · 设计图</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 32px 18px 60px;
      background: #f3f6f6;
      color: #17313c;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .wrap { max-width: 1180px; margin: 0 auto; }
    .back {
      display: inline-block;
      margin-bottom: 18px;
      color: #2d6f6b;
      font-size: 13px;
      text-decoration: none;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    .subtitle { margin: 0 0 26px; color: #70817f; font-size: 14px; }
    .diagram-card {
      margin-bottom: 26px;
      padding: 18px;
      border: 1px solid #dbe5e4;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(16, 42, 53, 0.07);
    }
    .diagram-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 12px;
    }
    .diagram-head h2 { margin: 0; font-size: 18px; }
    .diagram-head a { color: #2d6f6b; font-size: 12px; }
    .diagram-head > div { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .zoom-btn {
      padding: 5px 10px;
      border: 1px solid #bcd8cf;
      border-radius: 999px;
      background: #edf6f3;
      color: #1f5b58;
      font-size: 12px;
      font-weight: 700;
    }
    .diagram-card img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
      background: #f4f8f7;
      cursor: zoom-in;
    }
    .zoom-hint {
      display: inline-block;
      margin-left: 10px;
      color: #8fa29e;
      font-size: 11px;
    }
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      background: rgba(8, 26, 33, 0.9);
      overflow: hidden;
    }
    .lightbox.hidden {
      display: none;
    }
    .lightbox img {
      max-width: 96vw;
      max-height: 88vh;
      border-radius: 10px;
      background: #ffffff;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      touch-action: none;
      cursor: grab;
      transform-origin: center center;
      user-select: none;
      -webkit-user-drag: none;
    }
    .lightbox img.dragging {
      cursor: grabbing;
    }
    .lightbox-close {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 36px;
      height: 36px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 22px;
      line-height: 1;
      cursor: pointer;
    }
    .lightbox-toolbar {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.28);
      border-radius: 999px;
      background: rgba(16, 42, 53, 0.9);
      color: #ffffff;
    }
    .lightbox-toolbar button {
      min-width: 32px;
      height: 30px;
      border: none;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      font-size: 15px;
    }
    #zoom-level {
      min-width: 48px;
      text-align: center;
      font-size: 11px;
      color: #d8e6e2;
    }
    .zoom-tip {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.72);
      font-size: 11px;
      white-space: nowrap;
    }
    .note {
      margin: 18px 0 0;
      color: #8fa29e;
      font-size: 12px;
      line-height: 1.7;
    }
    @media (max-width: 640px) {
      .diagram-head {
        flex-direction: column;
        align-items: flex-start;
      }
      .diagram-head > div {
        flex-wrap: wrap;
      }
      .zoom-hint {
        display: block;
        margin: 4px 0 0;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <a class="back" href="index.html">← 返回演示入口</a>
    <h1>POI 数字疗法 · 两张设计图</h1>
    <p class="subtitle">概念图与分层技术架构图 · 可直接打开 SVG 或用于汇报排版</p>

    <section class="diagram-card">
      <div class="diagram-head">
        <h2>概念图：核心痛点 → 产品定位 → 全周期 → 功能模块<span class="zoom-hint">点击图片可放大</span></h2>
        <div>
          <button class="zoom-btn" data-src="assets/poi-concept-map.svg?v=4">放大查看</button>
          <a href="assets/poi-concept-map.svg?v=4" target="_blank" rel="noopener">打开 SVG 原图 →</a>
        </div>
      </div>
      <img src="assets/poi-concept-map.svg?v=4" alt="POI 数字疗法概念图" />
    </section>

    <section class="diagram-card">
      <div class="diagram-head">
        <h2>技术架构：数据 → 模型与规则 → 干预 → 结局追踪<span class="zoom-hint">点击图片可放大</span></h2>
        <div>
          <button class="zoom-btn" data-src="assets/poi-tech-architecture.svg?v=4">放大查看</button>
          <a href="assets/poi-tech-architecture.svg?v=4" target="_blank" rel="noopener">打开 SVG 原图 →</a>
        </div>
      </div>
      <img src="assets/poi-tech-architecture.svg?v=4" alt="POI 数字疗法技术架构图" />
    </section>

    <p class="note">
      两张图均为功能原型设计，数据与流程为演示用途；预测结果仅作风险提示，不替代医生诊断与治疗。
    </p>
  </div>

  <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="图片放大预览">
    <button id="lightbox-close" class="lightbox-close" aria-label="关闭">×</button>
    <div class="zoom-tip">双指缩放 · 拖动查看 · 双击复位</div>
    <img id="lightbox-img" alt="设计图放大预览" />
    <div class="lightbox-toolbar" aria-label="缩放工具">
      <button id="zoom-out" aria-label="缩小">−</button>
      <span id="zoom-level">100%</span>
      <button id="zoom-in" aria-label="放大">＋</button>
      <button id="zoom-reset" aria-label="重置缩放">重置</button>
    </div>
  </div>

  <script>
    const lightbox = document.getElementById("lightbox");
    const lightboxImg = document.getElementById("lightbox-img");
    const zoomLevel = document.getElementById("zoom-level");
    const pointers = new Map();

    let scale = 1;
    let panX = 0;
    let panY = 0;
    let startX = 0;
    let startY = 0;
    let originX = 0;
    let originY = 0;
    let startScale = 1;
    let pinchStartDistance = 0;

    function applyTransform() {
      lightboxImg.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
      zoomLevel.textContent = Math.round(scale * 100) + "%";
    }

    function resetZoom() {
      scale = 1;
      panX = 0;
      panY = 0;
      applyTransform();
    }

    function setZoom(nextScale) {
      scale = Math.min(5, Math.max(1, nextScale));
      if (scale === 1) {
        panX = 0;
        panY = 0;
      }
      applyTransform();
    }

    function openLightbox(src, alt) {
      lightboxImg.src = src;
      lightboxImg.alt = alt || "设计图放大预览";
      resetZoom();
      lightbox.classList.remove("hidden");
    }

    document.querySelectorAll(".diagram-card img").forEach(image => {
      image.addEventListener("click", () => {
        openLightbox(image.src, image.alt);
      });
    });

    document.querySelectorAll(".zoom-btn").forEach(button => {
      button.addEventListener("click", () => {
        openLightbox(button.dataset.src, "设计图放大预览");
      });
    });

    function closeLightbox() {
      lightbox.classList.add("hidden");
      lightboxImg.removeAttribute("src");
      pointers.clear();
      resetZoom();
    }

    document.getElementById("lightbox-close").addEventListener("click", closeLightbox);
    document.getElementById("zoom-in").addEventListener("click", () => setZoom(scale + 0.5));
    document.getElementById("zoom-out").addEventListener("click", () => setZoom(scale - 0.5));
    document.getElementById("zoom-reset").addEventListener("click", resetZoom);

    lightbox.addEventListener("click", event => {
      if (event.target === lightbox) closeLightbox();
    });

    lightbox.addEventListener("wheel", event => {
      if (lightbox.classList.contains("hidden")) return;
      event.preventDefault();
      setZoom(scale + (event.deltaY < 0 ? 0.2 : -0.2));
    }, { passive: false });

    lightboxImg.addEventListener("dblclick", () => {
      if (scale > 1) resetZoom();
      else setZoom(2);
    });

    lightboxImg.addEventListener("pointerdown", event => {
      event.preventDefault();
      lightboxImg.setPointerCapture(event.pointerId);
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (pointers.size === 1) {
        startX = event.clientX;
        startY = event.clientY;
        originX = panX;
        originY = panY;
        lightboxImg.classList.add("dragging");
      } else if (pointers.size === 2) {
        const points = Array.from(pointers.values());
        pinchStartDistance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        startScale = scale;
      }
    });

    lightboxImg.addEventListener("pointermove", event => {
      if (!pointers.has(event.pointerId)) return;
      pointers.set(event.pointerId, { x: event.clientX, y: event.clientY });

      if (pointers.size === 1 && scale > 1) {
        panX = originX + event.clientX - startX;
        panY = originY + event.clientY - startY;
        applyTransform();
      } else if (pointers.size === 2 && pinchStartDistance > 0) {
        const points = Array.from(pointers.values());
        const distance = Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y);
        setZoom(startScale * (distance / pinchStartDistance));
      }
    });

    function endPointer(event) {
      pointers.delete(event.pointerId);
      if (pointers.size < 2) pinchStartDistance = 0;
      if (pointers.size === 0) {
        lightboxImg.classList.remove("dragging");
      } else if (pointers.size === 1) {
        const remaining = Array.from(pointers.values())[0];
        startX = remaining.x;
        startY = remaining.y;
        originX = panX;
        originY = panY;
      }
    }

    lightboxImg.addEventListener("pointerup", endPointer);
    lightboxImg.addEventListener("pointercancel", endPointer);

    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !lightbox.classList.contains("hidden")) {
        closeLightbox();
      }
    });
  </script>
</body>
</html>
